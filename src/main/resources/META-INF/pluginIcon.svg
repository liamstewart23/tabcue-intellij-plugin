<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!--
    Three differently coloured tabs over a terminal window. The point of the plugin is telling
    several terminals apart, so the icon shows several - an earlier version drew one highlighted
    tab, which read as "terminal tab" rather than "distinguishable terminal tabs".
    Colours are the palette's own red / blue / teal accents, so the icon and the product agree.
  -->
  <rect x="2" y="4" width="11" height="7" rx="2" fill="#E05252"/>
  <rect x="14.5" y="4" width="11" height="7" rx="2" fill="#3574F0"/>
  <rect x="27" y="4" width="11" height="7" rx="2" fill="#2A9D9A"/>
  <rect x="2" y="13" width="36" height="23" rx="3" fill="none" stroke="#5A5D63" stroke-width="2"/>
  <path d="M8.5 21.5l4 3.5-4 3.5" fill="none" stroke="#3574F0" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="16" y="26.8" width="13" height="2.4" rx="1.2" fill="#5A5D63"/>
</svg>
