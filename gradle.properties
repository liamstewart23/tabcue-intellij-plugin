# Only used to *start* Gradle, since this machine has no JDK on PATH. The JDK used to compile is
# provisioned by the toolchain in build.gradle.kts, so this can be any recent runtime — note the
# IDE upgraded this one from Java 21 to 25 mid-development.
org.gradle.java.home=/Applications/PhpStorm.app/Contents/jbr/Contents/Home


org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true

# The IDE provides the Kotlin stdlib at runtime; bundling it causes classloader conflicts.
kotlin.stdlib.default.dependency=false
