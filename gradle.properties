# The JDK that compiles the plugin is provisioned by the toolchain in build.gradle.kts (Java 21 via
# the foojay resolver), so Gradle itself can start on any recent JDK found via JAVA_HOME or PATH.
# Deliberately no `org.gradle.java.home` here: it would hardcode one machine's JDK path and break
# every other clone. ./build.sh sets JAVA_HOME for machines with no JDK installed system-wide.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true

# The IDE provides the Kotlin stdlib at runtime; bundling it causes classloader conflicts.
kotlin.stdlib.default.dependency=false
